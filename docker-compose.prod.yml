# docker-compose.prod.yml — production compose file for the server
# Uses pre-built image from ghcr.io instead of building locally
# Deploy to server at ~/nps-api/docker-compose.yml

services:
  nps-api:
    image: ghcr.io/timoruohomaki/nps-api:latest
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - PORT=8081
      - DB_PATH=/data/nps.db
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=production
    volumes:
      # Named volume persists the SQLite database across `down`/recreate.
      # Wiped only by `docker compose down -v`. Back up with:
      #   docker compose cp nps-api:/data/nps.db ./nps-backup.db
      - nps-data:/data
    restart: unless-stopped

volumes:
  nps-data:
