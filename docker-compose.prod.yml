# docker-compose.prod.yml — production compose file for the server
# Uses pre-built image from ghcr.io instead of building locally
# Deploy to server at ~/nps-api/docker-compose.yml

services:
  nps-api:
    image: ghcr.io/timoruohomaki/nps-api:latest
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - PORT=8081
      - DB_PATH=/data/nps.db
      # base64 32-byte AES-256 key — REQUIRED in production to encrypt PII
      # (comment, timezone) at rest. Empty => stored unencrypted (logged as a
      # warning). Generate: openssl rand -base64 32
      - FEEDBACK_ENC_KEY=${FEEDBACK_ENC_KEY:-}
      # Comma-separated accepted X-API-Key values for POSTing feedback.
      # Empty => endpoint is open (requests pass without a key). Enable only once
      # BOTH clients send a matching key (see runbook rollout note).
      - API_KEYS=${API_KEYS:-}
      # Comma-separated CONSUMER keys for the GET analytics query (returns
      # decrypted PII). Empty => the read endpoint is disabled (503). Keep these
      # distinct from API_KEYS so a client key can't read everyone's feedback.
      - READ_API_KEYS=${READ_API_KEYS:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=production
    volumes:
      # Named volume persists the SQLite database across `down`/recreate.
      # Wiped only by `docker compose down -v`. Back up with:
      #   docker compose cp nps-api:/data/nps.db ./nps-backup.db
      - nps-data:/data
    restart: unless-stopped

volumes:
  nps-data:
