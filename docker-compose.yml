# docker-compose.yml — local development
# Builds locally and reads .env automatically

services:
  nps-api:
    build: .
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - PORT=8081
      - DB_PATH=/data/nps.db
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=development
    volumes:
      - nps-data:/data
    restart: unless-stopped

volumes:
  nps-data:
